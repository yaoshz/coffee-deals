<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C1E16">
<meta name="coffee-deals-version" content="v6.21">
<title>省咖啡｜優惠雷達</title>
<style>
  :root {
    --bg: #FAF8F5;
    --surface: #FFFFFF;
    --surface-subtle: #F3EFEA;
    --espresso: #2C1E16;
    --coffee: #5C3D2E;
    --terracotta: #B85D3B;
    --terracotta-soft: #FDF3EF;
    --emerald: #1F6E43;
    --emerald-soft: #ECF7F0;
    --amber: #9A6700;
    --amber-soft: #FEF8E7;
    --slate: #64748B;
    --slate-soft: #F1F5F9;
    --text-main: #1E1916;
    --text-muted: #78716C;
    --border: #E7E2DA;
    --shadow-sm: 0 2px 8px rgba(44, 30, 22, 0.04);
    --shadow-md: 0 12px 24px -6px rgba(44, 30, 22, 0.08);
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 64px;
  }
  button, input, select { font: inherit; }
  a { text-decoration: none; color: inherit; }

  /* 頂部極簡導覽列 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(250, 248, 245, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1160px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--espresso);
    color: #FAF8F5;
    display: grid;
    place-items: center;
    font-size: 18px;
  }
  .brand-title h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--espresso);
  }
  .brand-title p {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 480px;
    justify-content: flex-end;
  }
  .search-box {
    position: relative;
    flex: 1;
    min-width: 160px;
  }
  .search-box input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-main);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--coffee);
    box-shadow: 0 0 0 3px rgba(92, 61, 46, 0.1);
  }
  .search-box::before {
    content: "⌕";
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
  }
  .lang-select {
    padding: 8px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--espresso);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }

  /* 主容器 */
  .container {
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 0;
  }

  /* 狀態列與統計摘要 */
  .meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .meta-info {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--emerald);
    display: inline-block;
  }

  /* 狀態切換 Tabs */
  .status-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .status-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover {
    border-color: var(--coffee);
    color: var(--espresso);
  }
  .tab-btn.active {
    background: var(--espresso);
    border-color: var(--espresso);
    color: #FFFFFF;
  }
  .tab-count {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
    background: rgba(120, 113, 108, 0.15);
  }
  .tab-btn.active .tab-count {
    background: rgba(255, 255, 255, 0.2);
    color: #FFFFFF;
  }

  /* 品牌膠囊篩選列 */
  .brand-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 18px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .brand-strip::-webkit-scrollbar { display: none; }
  .brand-pill {
    border: 1px solid transparent;
    background: var(--surface-subtle);
    color: var(--coffee);
    padding: 6px 13px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .brand-pill:hover {
    background: #EAE3DA;
  }
  .brand-pill.active {
    background: var(--terracotta-soft);
    border-color: var(--terracotta);
    color: var(--terracotta);
  }

  /* 現代化卡片網格系統 */
  .deals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  /* 單張優惠卡片架構 */
  .deal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .deal-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: #D5CCC0;
  }

  /* 1. 高畫質縮圖區 (16:9) */
  .card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--surface-subtle);
    overflow: hidden;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .deal-card:hover .card-media img {
    transform: scale(1.03);
  }
  .media-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: linear-gradient(135deg, #F5EFE8 0%, #E8DFD5 100%);
    color: var(--espresso);
  }
  .media-fallback .fallback-brand {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .media-fallback .fallback-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* 浮動狀態徽章 */
  .status-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 700;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .status-active { background: rgba(236, 247, 240, 0.94); color: var(--emerald); }
  .status-upcoming { background: rgba(254, 248, 231, 0.94); color: var(--amber); }
  .status-verify { background: rgba(241, 245, 249, 0.94); color: var(--slate); }
  .status-expired { background: rgba(241, 245, 249, 0.9); color: #94A3B8; }

  /* 卡片內容主體 */
  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 12px;
  }

  /* 2. 核心標籤列 */
  .card-tags {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-brand {
    font-size: 11px;
    font-weight: 700;
    color: var(--espresso);
    background: var(--surface-subtle);
    padding: 3px 9px;
    border-radius: 6px;
  }
  .tag-promo {
    font-size: 11px;
    font-weight: 700;
    color: var(--terracotta);
    background: var(--terracotta-soft);
    padding: 3px 9px;
    border-radius: 6px;
  }

  /* 3. 標題 */
  .card-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.48;
    color: var(--text-main);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-title a:hover {
    color: var(--terracotta);
  }
  .card-details {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 4. 價格 / 核心優惠亮點 */
  .card-price-row {
    margin-top: auto;
    padding-top: 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .price-highlight {
    font-size: 17px;
    font-weight: 800;
    color: var(--terracotta);
    letter-spacing: -0.02em;
  }
  .valid-period {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--coffee);
    background: var(--surface-subtle);
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* 5. 地點與 6. 發布時間頁尾 */
  .card-footer {
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .meta-location, .meta-time {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta-location {
    font-weight: 600;
    color: var(--text-main);
    max-width: 52%;
  }

  /* 原文對照折疊 (非中文語系顯示) */
  .orig-details {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 6px 10px;
    border-radius: 8px;
  }
  .orig-details summary { cursor: pointer; font-weight: 600; }
  .orig-details p { margin: 4px 0 0; }

  /* 官方快速入口區塊 */
  .portals-section {
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }
  .section-head {
    margin-bottom: 14px;
  }
  .section-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--espresso);
  }
  .portals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 10px;
  }
  .portal-link {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 10px;
    text-align: center;
    transition: all 0.15s;
  }
  .portal-link:hover {
    border-color: var(--coffee);
    transform: translateY(-2px);
  }
  .portal-link strong {
    display: block;
    font-size: 13px;
    color: var(--espresso);
  }
  .portal-link span {
    font-size: 11px;
    color: var(--text-muted);
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 56px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    color: var(--text-muted);
    font-size: 14px;
  }

  .footer {
    max-width: 1160px;
    margin: 40px auto 0;
    padding: 20px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  @media (max-width: 600px) {
    .topbar-inner { padding: 12px 16px; }
    .controls { max-width: 100%; width: 100%; }
    .container { padding: 18px 16px 0; }
    .deals-grid { grid-template-columns: 1fr; gap: 16px; }
  }
</style>
</head>

    viewOrig: 'ดูข้อความภาษาจีนต้นฉบับ',
    priceDeal: 'ราคาพิเศษ',
    promoBogo: 'ซื้อ 1 แถม 1',
    promoMulti: 'แพ็กสุดคุ้ม',
    promoSecond: 'โปรแก้วที่ 2',
    promoDiscount: 'ส่วนลดพิเศษ'
  }
};

const BRAND_COLORS = {
  '星巴克': 'linear-gradient(135deg, #1E3932 0%, #2D5A4C 100%)',
  '7-ELEVEN': 'linear-gradient(135deg, #007A33 0%, #E87722 100%)',
  '全家': 'linear-gradient(135deg, #0066B3 0%, #00A0E9 100%)',
  '萊爾富': 'linear-gradient(135deg, #C8102E 0%, #E35205 100%)',
  'OKmart': 'linear-gradient(135deg, #D9531E 0%, #F39200 100%)',
  '美廉社': 'linear-gradient(135deg, #1D4ED8 0%, #3B82F6 100%)',
  '路易莎': 'linear-gradient(135deg, #4A2E1B 0%, #8C5A3C 100%)',
  '85°C': 'linear-gradient(135deg, #991B1B 0%, #DC2626 100%)',
  '全聯': 'linear-gradient(135deg, #004B87 0%, #0077C8 100%)'
};

let state = {
  lang: localStorage.getItem('coffee-lang') || 'zh-Hant',
  status: 'active',
  brand: 'ALL',
  query: '',
  deals: [],
  updatedAt: ''
};

const $ = sel => document.querySelector(sel);
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeImageUrl(value) {
  try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : ''; }
  catch (_) { return ''; }
}

const t = (key, vars = {}) => {
  let str = (I18N[state.lang] && I18N[state.lang][key]) || I18N['zh-Hant'][key] || key;
  Object.entries(vars).forEach(([k, v]) => { str = str.replace(`{${k}}`, v); });
  return str;
};

// 萃取結構化價格與核心促銷標籤
function extractPriceAndTag(deal) {
  const offer = deal.offer || '';
  const mechs = Array.isArray(deal.promotion_mechanisms) ? deal.promotion_mechanisms : [];
  let priceText = '';
  let promoTag = '';

  if (mechs.length > 0) {
    const m = mechs[0];
    if (m.mechanism === 'buy_x_get_y') {
      priceText = `買 ${m.buy} 送 ${m.get}`;
      promoTag = m.buy === 1 && m.get === 1 ? t('promoBogo') : `買${m.buy}送${m.get}`;
    } else if (m.mechanism === 'n_cups_fixed_price') {
      priceText = `${m.count} 杯 NT$${m.price}`;
      promoTag = t('promoMulti');
    } else if (m.mechanism === 'second_cup_discount') {
      priceText = `第 2 杯 ${m.value}${m.unit}`;
      promoTag = t('promoSecond');
    } else if (m.mechanism === 'flat_discount') {
      priceText = `現折 NT$${m.amount}`;
      promoTag = t('promoDiscount');
    } else if (m.mechanism === 'single_price') {
      priceText = `NT$ ${m.price}`;
      promoTag = t('priceDeal');
    }
  }

  if (!priceText) {
    const bogo = offer.match(/買\s*([一1二2十\d]+)\s*送\s*([一1二2十\d]+)/);
    const cups = offer.match(/(\d+)\s*杯\s*(\d[\d,]*)\s*元/);
    const single = offer.match(/(\d[\d,]*)\s*元/);
    if (bogo) {
      priceText = `買 ${bogo[1]} 送 ${bogo[2]}`;
      promoTag = t('promoBogo');
    } else if (cups) {
      priceText = `${cups[1]} 杯 NT$${cups[2]}`;
      promoTag = t('promoMulti');
    } else if (single) {
      priceText = `NT$ ${single[1]}`;
      promoTag = t('priceDeal');
    } else {
      priceText = '優惠詳情見原文';
      promoTag = '飲品優惠';
    }
  }

  return { priceText, promoTag };
}

// 格式化適用地點 / 通路
function formatLocation(deal) {
  const scope = (deal.channel_scope || '').toLowerCase();
  const detail = deal.channel_scope_text || '';
  if (scope === 'store') return detail ? `門市｜${detail}` : t('locStore');
  if (scope === 'app') return detail ? `APP｜${detail}` : t('locApp');
  if (scope === 'delivery') return detail ? `外送｜${detail}` : t('locDelivery');
  return t('locAll');
}

// 格式化發布時間
function formatPublishTime(deal) {
  const raw = deal.published || '';
  if (!raw) return deal.start_date || '近期情報';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw.slice(0, 10);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
}

// 格式化活動效期
function formatValidRange(deal) {
  if (deal.start_date && deal.end_date) {
    return `${deal.start_date.slice(5).replace('-', '/')} – ${deal.end_date.slice(5).replace('-', '/')}`;
  }
  if (deal.date_text && !deal.date_text.includes('待確認')) {
    return deal.date_text;
  }
  return t('dateVerify');
}

function updateUIText() {
  $('#ui-site-name').textContent = t('siteName');
  $('#ui-site-sub').textContent = t('siteSub');
  $('#search-input').placeholder = t('searchPlaceholder');
  $('#tab-active-label').textContent = t('tabActive');
  $('#tab-upcoming-label').textContent = t('tabUpcoming');
  $('#tab-verify-label').textContent = t('tabVerify');
  $('#tab-expired-label').textContent = t('tabExpired');
  $('#ui-portals-title').textContent = t('portalsTitle');
  if (state.updatedAt) {
    const d = new Date(state.updatedAt);
    const formatted = isNaN(d.getTime()) ? state.updatedAt : d.toLocaleString('zh-TW', { hour12: false });
    $('#ui-updated').textContent = t('updated', { date: formatted });
  }
}

function renderBrandStrip(statusDeals) {
  const strip = $('#brand-strip');
  strip.innerHTML = '';
  const brands = ['ALL', ...new Set(statusDeals.map(d => d.store).filter(Boolean))];
  if (!brands.includes(state.brand)) state.brand = 'ALL';

  brands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'brand-pill' + (state.brand === b ? ' active' : '');
    btn.textContent = b === 'ALL' ? t('allBrands') : b;
    btn.onclick = () => {
      state.brand = b;
      render();
    };
    strip.appendChild(btn);
  });
}

function createCard(deal) {
  const card = document.createElement('article');
  card.className = 'deal-card';

  const { priceText, promoTag } = extractPriceAndTag(deal);
  const statusMap = {
    active: ['status-active', t('statusActive')],
    upcoming: ['status-upcoming', t('statusUpcoming')],
    verify: ['status-verify', t('statusVerify')],
    expired: ['status-expired', t('statusExpired')]
  };
  const [statusCls, statusLabel] = statusMap[deal.status] || statusMap.verify;
  const link = safeImageUrl(deal.article_url || (deal.source_urls && deal.source_urls[0]) || '') || '#';

  // 1. 高畫質縮圖區塊 (支援 image_url 或品牌質感封面)
  const media = document.createElement('div');
  media.className = 'card-media';
  const bgStyle = BRAND_COLORS[deal.store] || 'linear-gradient(135deg, #3E2723 0%, #6D4C41 100%)';

  const renderFallback = () => {
    media.innerHTML = `
      <div class="media-fallback" style="background: ${bgStyle}; color: #FFFFFF;">
        <div class="fallback-brand">${escapeHtml(deal.store || 'COFFEE DEAL')}</div>
        <div class="fallback-sub" style="color: rgba(255,255,255,0.75);">${escapeHtml(promoTag)}</div>
      </div>
      <span class="status-badge ${statusCls}">${escapeHtml(statusLabel)}</span>
    `;
  };

  if (safeImageUrl(deal.image_url)) {
    const img = document.createElement('img');
    img.src = safeImageUrl(deal.image_url);
    img.alt = deal.offer || deal.store;
    img.loading = 'lazy';
    img.onerror = renderFallback;
    media.appendChild(img);
    const badge = document.createElement('span');
    badge.className = `status-badge ${statusCls}`;
    badge.textContent = statusLabel;
    media.appendChild(badge);
  } else {
    renderFallback();
  }
  card.appendChild(media);

  // 卡片內容主體
  const body = document.createElement('div');
  body.className = 'card-body';

  // 2. 核心標籤
  const tags = document.createElement('div');
  tags.className = 'card-tags';
  tags.innerHTML = `
    <span class="tag-brand">${escapeHtml(deal.store || '品牌待確認')}</span>
    <span class="tag-promo">${escapeHtml(promoTag)}</span>
  `;
  body.appendChild(tags);

  // 3. 標題
  const title = document.createElement('h3');
  title.className = 'card-title';
  const a = document.createElement('a');
  a.href = link;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = deal.offer || deal.article_title;
  title.appendChild(a);
  body.appendChild(title);

  if (deal.details) {
    const desc = document.createElement('p');
    desc.className = 'card-details';
    desc.textContent = deal.details;
    body.appendChild(desc);
  }

  // 非中文模式保留原文對照
  if (state.lang !== 'zh-Hant' && deal.offer) {
    const orig = document.createElement('details');
    orig.className = 'orig-details';
    orig.innerHTML = `<summary>${escapeHtml(t('viewOrig'))}</summary><p>${escapeHtml(deal.offer)}</p>`;
    body.appendChild(orig);
  }

  // 4. 價格與效期
  const priceRow = document.createElement('div');
  priceRow.className = 'card-price-row';
  priceRow.innerHTML = `
    <span class="price-highlight">${escapeHtml(priceText)}</span>
    <span class="valid-period">📅 ${escapeHtml(formatValidRange(deal))}</span>
  `;
  body.appendChild(priceRow);

  // 5. 地點 & 6. 發布時間
  const footer = document.createElement('div');
  footer.className = 'card-footer';
  footer.innerHTML = `
    <span class="meta-location" title="${escapeHtml(formatLocation(deal))}">📍 ${escapeHtml(formatLocation(deal))}</span>
    <span class="meta-time">🕒 ${escapeHtml(formatPublishTime(deal))}</span>
  `;
  body.appendChild(footer);

  card.appendChild(body);
  return card;
}

function render() {
  updateUIText();

  // 更新各狀態計數
  ['active', 'upcoming', 'verify', 'expired'].forEach(st => {
    const cnt = state.deals.filter(d => (d.status || 'verify') === st).length;
    const el = $(`#count-${st}`);
    if (el) el.textContent = cnt;
  });

  // 篩選當前狀態資料
  const statusFiltered = state.deals.filter(d => (d.status || 'verify') === state.status);
  renderBrandStrip(statusFiltered);

  // 篩選品牌與關鍵字
  const q = state.query.toLowerCase();
  const finalDeals = statusFiltered.filter(d => {
    if (state.brand !== 'ALL' && d.store !== state.brand) return false;
    if (q) {
      const hay = `${d.store} ${d.offer} ${d.details || ''} ${d.article_title || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const grid = $('#deals-grid');
  grid.innerHTML = '';

  if (finalDeals.length === 0) {
    grid.innerHTML = `<div class="empty-state">${t('empty')}</div>`;
    return;
  }

  finalDeals.forEach(deal => {
    grid.appendChild(createCard(deal));
  });
}

async function init() {
  $('#lang-select').value = state.lang;
  $('#lang-select').addEventListener('change', e => {
    state.lang = e.target.value;
    localStorage.setItem('coffee-lang', state.lang);
    render();
  });

  $('#search-input').addEventListener('input', e => {
    state.query = e.target.value.trim();
    render();
  });

  $('#status-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.status = btn.dataset.status;
    render();
  });

  try {
    const res = await fetch(`./deals.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.deals = Array.isArray(data.deals) ? data.deals : [];
    state.updatedAt = data.updated_at || '';
    render();
  } catch (err) {
    console.error(err);
    $('#deals-grid').innerHTML = `<div class="empty-state">無法載入 deals.json，請稍後再試。</div>`;
  }
}

init();
</script>
</body>
</html>
