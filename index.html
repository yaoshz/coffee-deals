<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a2a">
<title>省咖啡｜優惠雷達</title>
<style>
:root{--coffee:#5b3a2a;--coffee2:#7a5138;--cream:#f7f0e9;--paper:#fffdfb;--ink:#30241f;--muted:#81756f;--coral:#d96f56;--green:#2d7547;--line:#eaded4;--gold:#f2d9a6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;padding-bottom:34px}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(140deg,#754c35,#42291f);color:#fff;padding:22px 17px 20px;position:sticky;top:0;z-index:20;box-shadow:0 5px 18px #38231825}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:850;letter-spacing:.2px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:4px;letter-spacing:0}
.date-pill{font-size:11px;border:1px solid #ffffff45;background:#ffffff12;border-radius:99px;padding:7px 9px;white-space:nowrap}
.search-wrap{display:flex;gap:8px;margin-top:17px}.search-wrap input{width:100%;min-width:0;border:0;border-radius:12px;background:#fff;color:var(--ink);padding:12px 13px;outline:none}.search-wrap button{border:0;border-radius:12px;padding:0 14px;background:#e5b98d;color:#38251c;font-weight:800}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;font-size:11px;color:#f4e6dc}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8fe0a5;margin-right:6px}.status-right{opacity:.78;text-align:right}
main{max-width:850px;margin:auto}.section{padding:0 15px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 11px}.section-heading h2{font-size:16px;margin:0;font-weight:850}.section-heading p{font-size:11px;color:var(--muted);margin:4px 0 0}
.portals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.portal{min-height:91px;background:var(--paper);border:1px solid var(--line);border-radius:15px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:10px 5px;box-shadow:0 2px 5px #3c251009}.portal .emoji{font-size:24px}.portal strong{font-size:12px}.portal span:last-child{font-size:10px;color:var(--muted)}
.quick-links{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.quick-links::-webkit-scrollbar{display:none}.quick{flex:0 0 auto;border:1px solid var(--line);background:#fffaf6;color:var(--coffee);border-radius:99px;padding:9px 12px;text-decoration:none;font-size:12px;font-weight:750}
.filter-bar{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;padding:2px 0 5px;scrollbar-width:none}.filter{border:0;background:#eadbce;color:#5c4436;border-radius:99px;padding:9px 13px;font-size:12px;font-weight:800}.filter.active{background:var(--coffee);color:#fff}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 10px}.results-head h2{font-size:17px;margin:0}.count{font-size:11px;color:var(--muted)}
.refresh{border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--coffee);padding:7px 10px;font-size:12px;font-weight:800}
.news-card{display:block;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--coffee2);border-radius:13px;padding:14px 13px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:0 2px 6px #3c25100a}.news-card.buy{border-left-color:var(--coral)}.news-card.life{border-left-color:var(--green)}
.card-title{font-size:14px;line-height:1.5;font-weight:800;margin:0 0 10px;color:#241a16;overflow-wrap:anywhere}.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}.source{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}.chips{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.tag{border-radius:5px;padding:3px 6px;font-size:10px;font-weight:800;white-space:nowrap}.tag-buy{background:#ffebe6;color:#b63e2b}.tag-life{background:#e6f3e9;color:#276b40}.tag-coffee{background:#f2e8df;color:#6b4935}
.loading,.empty{background:#fffaf6;border:1px dashed #d8c5b7;border-radius:14px;padding:23px 15px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.loading strong{display:block;color:var(--coffee);margin-bottom:5px}.retry{margin-top:10px;border:0;background:var(--coffee);color:#fff;padding:9px 14px;border-radius:9px;font-weight:800}
.notice{margin:13px 0 0;padding:12px;border-radius:11px;background:#f0e5d9;color:#6c5548;font-size:11px;line-height:1.7}
.footer{padding:22px 15px 5px;text-align:center;color:#94857c;font-size:10px;line-height:1.8}
.hide{display:none!important}
@media(min-width:620px){.hero{padding-left:max(22px,calc((100vw - 820px)/2));padding-right:max(22px,calc((100vw - 820px)/2))}.portals{grid-template-columns:repeat(6,minmax(0,1fr))}.section{padding:0 22px}.portal{min-height:105px}.brand{font-size:24px}}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-top">
  <div class="brand">☕ 省咖啡・優惠雷達<small>咖啡折扣 × 超商寄杯 × 生活省錢情報</small></div>
  <div class="date-pill" id="today">今日看板</div>
 </div>
 <form class="search-wrap" id="search-form">
  <input id="search-input" type="search" placeholder="搜尋：買一送一、寄杯、拿鐵、超商…" aria-label="搜尋優惠">
  <button type="submit">搜尋</button>
 </form>
 <div class="status-line"><span><i class="status-dot"></i><span id="status-text">準備讀取公開新聞 RSS</span></span><span class="status-right" id="updated">尚未更新</span></div>
</header>
<main>
 
<section class="section">
  <div class="section-heading">
    <div>
      <h2>☕ 今日有效咖啡優惠</h2>
      <p>自動整理新聞優惠，請以商家官方公告為準</p>
    </div>
  </div>
  <div id="todayCoffeeDeals">
    <p>正在載入今日咖啡優惠…</p>
  </div>
</section>
<section class="section">
  <div class="section-heading"><div><h2>🏪 官方活動快速入口</h2><p>點選後前往品牌網站或優惠搜尋</p></div></div>
  <div class="portals">
   <a class="portal" href="https://www.7-11.com.tw/" target="_blank" rel="noopener"><span class="emoji">🏪</span><strong>7-ELEVEN</strong><span>官方活動</span></a>
   <a class="portal" href="https://www.family.com.tw/" target="_blank" rel="noopener"><span class="emoji">💙</span><strong>全家便利商店</strong><span>隨買跨店</span></a>
   <a class="portal" href="https://www.hilife.com.tw/" target="_blank" rel="noopener"><span class="emoji">🟢</span><strong>萊爾富</strong>
