<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a2a">
<title>省咖啡｜優惠雷達</title>
<style>
:root{--coffee:#5b3a2a;--coffee2:#7a5138;--cream:#f7f0e9;--paper:#fffdfb;--ink:#30241f;--muted:#81756f;--coral:#d96f56;--green:#2d7547;--line:#eaded4;--gold:#f2d9a6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;padding-bottom:34px}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(140deg,#754c35,#42291f);color:#fff;padding:22px 17px 20px;position:sticky;top:0;z-index:20;box-shadow:0 5px 18px #38231825}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:850;letter-spacing:.2px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:4px;letter-spacing:0}
.date-pill{font-size:11px;border:1px solid #ffffff45;background:#ffffff12;border-radius:99px;padding:7px 9px;white-space:nowrap}
.search-wrap{display:flex;gap:8px;margin-top:17px}.search-wrap input{width:100%;min-width:0;border:0;border-radius:12px;background:#fff;color:var(--ink);padding:12px 13px;outline:none}.search-wrap button{border:0;border-radius:12px;padding:0 14px;background:#e5b98d;color:#38251c;font-weight:800}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;font-size:11px;color:#f4e6dc}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8fe0a5;margin-right:6px}.status-right{opacity:.78;text-align:right}
main{max-width:850px;margin:auto}.section{padding:0 15px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 11px}.section-heading h2{font-size:16px;margin:0;font-weight:850}.section-heading p{font-size:11px;color:var(--muted);margin:4px 0 0}
.portals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.portal{min-height:91px;background:var(--paper);border:1px solid var(--line);border-radius:15px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:10px 5px;box-shadow:0 2px 5px #3c251009}.portal .emoji{font-size:24px}.portal strong{font-size:12px}.portal span:last-child{font-size:10px;color:var(--muted)}
.quick-links{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.quick-links::-webkit-scrollbar{display:none}.quick{flex:0 0 auto;border:1px solid var(--line);background:#fffaf6;color:var(--coffee);border-radius:99px;padding:9px 12px;text-decoration:none;font-size:12px;font-weight:750}
.filter-bar{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;padding:2px 0 5px;scrollbar-width:none}.filter{border:0;background:#eadbce;color:#5c4436;border-radius:99px;padding:9px 13px;font-size:12px;font-weight:800}.filter.active{background:var(--coffee);color:#fff}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 10px}.results-head h2{font-size:17px;margin:0}.count{font-size:11px;color:var(--muted)}
.refresh{border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--coffee);padding:7px 10px;font-size:12px;font-weight:800}
.news-card{display:block;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--coffee2);border-radius:13px;padding:14px 13px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:0 2px 6px #3c25100a}.news-card.buy{border-left-color:var(--coral)}.news-card.life{border-left-color:var(--green)}
.card-title{font-size:14px;line-height:1.5;font-weight:800;margin:0 0 10px;color:#241a16;overflow-wrap:anywhere}.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}
.loading,.empty{background:#fffaf6;border:1px dashed #d8c5b7;border-radius:14px;padding:23px 15px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.loading strong{display:block;color:var(--coffee);margin-bottom:5px}
.notice{margin:13px 0 0;padding:12px;border-radius:11px;background:#f0e5d9;color:#6c5548;font-size:11px;line-height:1.7}
.footer{padding:22px 15px 5px;text-align:center;color:#94857c;font-size:10px;line-height:1.8}
@media(min-width:620px){.hero{padding-left:max(22px,calc((100vw - 820px)/2));padding-right:max(22px,calc((100vw - 820px)/2))}.portals{grid-template-columns:repeat(6,minmax(0,1fr))}.section{padding:0 22px}.portal{min-height:105px}.brand{font-size:24px}}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-top">
  <div class="brand">☕ 省咖啡・優惠雷達<small>咖啡折扣 × 超商寄杯 × 生活省錢情報</small></div>
  <div class="date-pill" id="today">今日看板</div>
 </div>
 <form class="search-wrap" id="search-form">
  <input id="search-input" type="search" placeholder="搜尋：買一送一、寄杯、拿鐵、超商…" aria-label="搜尋優惠">
  <button type="submit">搜尋</button>
 </form>
 <div class="status-line"><span><i class="status-dot"></i><span id="status-text">公開優惠情報站</span></span><span class="status-right" id="updated">載入中</span></div>
</header>
<main>

<section class="section">
  <div class="section-heading">
    <div>
      <h2>☕ 今日有效咖啡優惠</h2>
      <p>即時過濾有效折扣，活動詳情請依門市公告為準</p>
    </div>
  </div>
  <div id="todayCoffeeDeals">
    <p>正在載入今日咖啡優惠…</p>
  </div>
</section>

<section class="section">
  <div class="section-heading"><div><h2>🏪 官方活動快速入口</h2><p>點選後前往品牌網站或官方 App</p></div></div>
  <div class="portals">
   <a class="portal" href="https://www.7-11.com.tw/" target="_blank" rel="noopener"><span class="emoji">🏪</span><strong>7-ELEVEN</strong><span>官方活動</span></a>
   <a class="portal" href="https://www.family.com.tw/" target="_blank" rel="noopener"><span class="emoji">💙</span><strong>全家便利商店</strong><span>隨買跨店</span></a>
   <a class="portal" href="https://www.hilife.com.tw/" target="_blank" rel="noopener"><span class="emoji">🟢</span><strong>萊爾富</strong><span>官方活動</span></a>
   <a class="portal" href="https://www.okmart.com.tw/" target="_blank" rel="noopener"><span class="emoji">🟠</span><strong>OK mart</strong><span>官方活動</span></a>
   <a class="portal" href="https://www.starbucks.com.tw/" target="_blank" rel="noopener"><span class="emoji">🧜</span><strong>星巴克</strong><span>咖啡優惠</span></a>
   <a class="portal" href="https://www.louisacoffee.co/" target="_blank" rel="noopener"><span class="emoji">☕</span><strong>路易莎</strong><span>門市活動</span></a>
  </div>
  
  <div class="section-heading"><div><h2>🔎 社群與即時搜尋</h2><p>直接查看 PTT 與社群最新討論</p></div></div>
  <div class="quick-links">
   <a class="quick" href="https://www.google.com/search?q=site%3Aptt.cc%2Fbbs%2FLifeismoney+咖啡+買一送一" target="_blank" rel="noopener">PTT 咖啡優惠</a>
   <a class="quick" href="https://www.google.com/search?q=site%3Adcard.tw%2Ff%2Fmoney+咖啡+優惠" target="_blank" rel="noopener">Dcard 咖啡優惠</a>
   <a class="quick" href="https://www.google.com/search?q=超商+咖啡+寄杯+優惠+最新" target="_blank" rel="noopener">超商寄杯搜尋</a>
  </div>
</section>
</main>

<div class="footer">省咖啡・個人使用版｜自動彙整優惠資訊</div>

<script>
const $ = s => document.querySelector(s);
const today = new Date();
const todayISO = [
  today.getFullYear(),
  String(today.getMonth() + 1).padStart(2, '0'),
  String(today.getDate()).padStart(2, '0')
].join('-');

$('#today').textContent = `📅 ${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}`;

function makeEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function makeLink(url, title) {
  const a = makeEl('a', 'news-card');
  a.href = url || '#';
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.appendChild(makeEl('div', 'card-title', title));
  return a;
}

async function loadCoffeeDeals() {
  const box = $('#todayCoffeeDeals');
  box.innerHTML = '';

  try {
    const response = await fetch('./deals.json?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('deals.json 讀取失敗');

    const data = await response.json();
    const deals = Array.isArray(data.deals) ? data.deals : [];

    // 所有有效關鍵品項名單
    const validItems = ["咖啡珍珠歐蕾", "珍珠奶茶", "珍珠撞奶", "香椰厚拿鐵", "厚濃抹茶拿鐵", "抹茶拿鐵", "燕麥拿鐵", "重乳拿鐵", "濃萃美式", "濃萃拿鐵", "特濃美式", "特濃拿鐵", "單品美式", "單品拿鐵", "西西里", "星沁爽", "冰淇淋紅茶", "檸檬青茶", "檸檬紅茶", "青梅冰茶", "蕎麥奶茶", "蕎麥茶", "水果茶", "卡布奇諾", "瑪奇朵", "拿鐵", "美式", "抹茶", "珍珠", "紅茶", "綠茶", "青茶", "奶茶", "歐蕾", "可可", "冰沙", "果昔", "霜淇淋", "咖啡"];

    // 嚴格過濾重複與非優惠句
    const seen = new Set();
    const active = [];

    deals.forEach(d => {
      let offer = (d.offer || '').trim();
      
      // 1. 阻擋無品項或股票導言
      if (!validItems.some(item => offer.includes(item))) return;
      if (/^(如果|反過來說|最後|連假|每天|不想|想買|固定|和 7|想直|提醒|快來|颱風|本周|4大|頂呱呱|▲)/.test(offer)) return;
      
      // 移除網頁誤植的 3杯77元
      if (/3\s*杯\s*77\s*元/.test(offer.replace(/\s/g, ''))) return;

      // 轉換中文數字以利去重
      for (const [ch, n] of [['十','10'],['一','1'],['二','2'],['三','3'],['四','4'],['五','5'],['六','6'],['七','7'],['八','8'],['九','9']]) {
        offer = offer.replace(new RegExp(ch, 'g'), n);
      }

      // 2. 擷取特徵去重 (店家 + 核心品項 + 核心機制)
      const store = d.store || '超商';
      
      // 取出最長的相符品項
      let matchedItems = validItems.filter(item => offer.includes(item));
      if (matchedItems.some(x => ['濃萃美式', '特濃美式', '單品美式'].includes(x))) matchedItems = matchedItems.filter(x => x !== '美式');
      if (matchedItems.some(x => ['濃萃拿鐵', '特濃拿鐵', '重乳拿鐵', '燕麥拿鐵', '單品拿鐵', '抹茶拿鐵', '厚乳拿鐵'].includes(x))) matchedItems = matchedItems.filter(x => x !== '拿鐵');
      if (matchedItems.length > 1) matchedItems = matchedItems.filter(x => x !== '咖啡');
      const prod = matchedItems.sort().join('+') || '未知品項';
      
      // 擷取買送或杯數價格機制
      let mech = '';
      const m1 = offer.match(/買\s*(\d+)\s*送\s*(\d+)/);
      if (m1) mech = `買${m1[1]}送${m1[2]}`;
      if (!mech) {
        const m2 = offer.match(/(\d+)\s*杯(?:組)?\s*([\d,]+)\s*元/);
        if (m2) mech = `${m2[1]}杯${m2[2].replace(/,/g, '')}元`;
      }
      if (!mech) {
        const m3 = offer.match(/第2杯(只要|半價|打)?(\d+)?(元|折)?/);
        if (m3) mech = m3[0].replace(/\s/g, '');
      }
      if (!mech) {
        const m4 = offer.match(/單杯\s*([\d,]+)\s*元/);
        if (m4) mech = `單杯${m4[1].replace(/,/g, '')}元`;
      }
      if (!mech && offer.includes('半價')) mech = '半價';
      if (!mech) mech = offer.replace(/[^\w]/g, '').slice(0, 10);
      
      const key = `${store}|${prod}|${mech}`;
      if (seen.has(key)) return;
      seen.add(key);

      // 檢查日期是否為今日有效
      if (d.start_date && d.end_date && d.start_date <= todayISO && todayISO <= d.end_date) {
        active.push(d);
      }
    });

    $('#updated').textContent = `更新 ${new Date(data.updated_at || Date.now()).toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})}`;
    box.appendChild(makeEl('p', '', `今日精選出 ${active.length} 筆不重複優惠：`));

    if (active.length === 0) {
      box.appendChild(makeEl('div', 'empty', '目前今日沒有明確日期的咖啡活動，請參考官方入口查看即時優惠。'));
      return;
    }

    let currentStore = '';
    active.forEach(d => {
      if (d.store !== currentStore) {
        currentStore = d.store;
        const h = makeEl('h3', '', currentStore);
        h.style.margin = '22px 0 8px';
        h.style.color = 'var(--coffee)';
        box.appendChild(h);
      }

      const card = makeLink(d.article_url, d.offer);
      card.classList.add('life');
      const dateText = `活動期間：${d.start_date} ～ ${d.end_date}`;
      card.appendChild(makeEl('div', 'card-bottom', dateText));
      box.appendChild(card);
    });

  } catch (error) {
    box.appendChild(makeEl('div', 'empty', '暫時無法讀取優惠資料，請稍後再試。'));
  }
}

loadCoffeeDeals();
</script>
</body>
</html>
