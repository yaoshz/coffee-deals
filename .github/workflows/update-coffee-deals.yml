name: Update coffee deals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時一次：台灣時間 02:00、08:00、14:00、20:00

permissions:
  contents: write

concurrency:
  group: coffee-deals-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -v
      - name: Scrape and update deals.json
        run: python scraper.py
      - name: Commit updated snapshot only when changed
        run: |
          if git diff --quiet -- deals.json; then
            echo "No deals.json changes; skip commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "chore: update coffee deals snapshot"
          git push
